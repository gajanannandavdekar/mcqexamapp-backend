spring.application.name=McqExamApp
server.port=8081

# Postgres — uses Render's env vars in production, falls back to local values for your own machine
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mcqexamdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_BASE64_STRING_AT_LEAST_256_BITS}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=2592000000

# Resend (email OTP)
resend.api-key=${RESEND_API_KEY:YOUR_RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Request logging (dev only)
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG